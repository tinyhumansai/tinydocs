name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump to release
        type: choice
        required: true
        options:
          - patch
          - minor
          - major

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    name: Publish crate
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    environment: Production
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: true

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --all-features

      - name: Build documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --all-features

      - name: Compute next version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          metadata="$(cargo metadata --format-version 1 --no-deps)"
          crate_name="tinydocs"
          current_version="$(jq -r '.packages[] | select(.name == "tinydocs") | .version' <<< "$metadata")"
          if [[ -z "$current_version" || "$current_version" == "null" ]]; then
            echo "Could not resolve the current crate version" >&2
            exit 1
          fi

          IFS=. read -r major minor patch <<< "$current_version"
          case "${{ inputs.bump }}" in
            major)
              major=$((major + 1))
              minor=0
              patch=0
              ;;
            minor)
              minor=$((minor + 1))
              patch=0
              ;;
            patch)
              patch=$((patch + 1))
              ;;
            *)
              echo "Unsupported bump: ${{ inputs.bump }}" >&2
              exit 1
              ;;
          esac

          next_version="${major}.${minor}.${patch}"
          tag="v${next_version}"

          git fetch --tags origin
          if git rev-parse --verify --quiet "refs/tags/${tag}"; then
            echo "Tag ${tag} already exists" >&2
            exit 1
          fi

          {
            echo "crate_name=${crate_name}"
            echo "current_version=${current_version}"
            echo "next_version=${next_version}"
            echo "tag=${tag}"
          } >> "$GITHUB_OUTPUT"

      - name: Update crate version
        env:
          CRATE_NAME: ${{ steps.version.outputs.crate_name }}
          NEXT_VERSION: ${{ steps.version.outputs.next_version }}
        run: |
          set -euo pipefail
          perl -0pi -e 's/(\[package\][\s\S]*?\nversion = ")[^"]+(")/$1$ENV{NEXT_VERSION}$2/' Cargo.toml
          perl -0pi -e 's/(\[package\][\s\S]*?\nversion = ")[^"]+(")/$1$ENV{NEXT_VERSION}$2/' crates/tinydocs-module/Cargo.toml
          cargo update -p "$CRATE_NAME" --precise "$NEXT_VERSION"

      - name: Commit version bump and tag
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock crates/tinydocs-module/Cargo.toml
          git commit -m "Release ${RELEASE_TAG}"
          git tag -a "${RELEASE_TAG}" -m "Release ${RELEASE_TAG}"

      - name: Package crate
        run: cargo package --locked --package tinydocs

      - name: Push release commit and tag
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          git push origin "HEAD:${GITHUB_REF_NAME}"
          git push origin "${RELEASE_TAG}"

      - name: Publish to crates.io
        run: cargo publish --locked --package tinydocs
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  build-modules:
    name: Build module (${{ matrix.os }})
    needs: publish
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            library: libtinydocs_module.so
          - os: macos-latest
            library: libtinydocs_module.dylib
          - os: windows-latest
            library: tinydocs_module.dll
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.publish.outputs.tag }}
          persist-credentials: false
          submodules: true

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build loadable module
        run: cargo build --locked --release --package tinydocs-module

      - name: Name release asset
        id: asset
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.publish.outputs.tag }}
          SOURCE_LIBRARY: ${{ matrix.library }}
        run: |
          set -euo pipefail
          host_target="$(rustc -vV | sed -n 's/^host: //p')"
          extension="${SOURCE_LIBRARY##*.}"
          asset="tinydocs-${RELEASE_TAG}-${host_target}.${extension}"
          cp "target/release/${SOURCE_LIBRARY}" "$asset"
          echo "path=${asset}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: tinydocs-module-${{ runner.os }}
          path: ${{ steps.asset.outputs.path }}
          if-no-files-found: error

  github-release:
    name: Upload module binaries
    needs: [publish, build-modules]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: tinydocs-module-*
          merge-multiple: true
          path: release-assets

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.publish.outputs.tag }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$RELEASE_TAG" release-assets/* --verify-tag --generate-notes
