name: Release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag (vX.Y.Z) committed through a reviewed PR
        type: string
        required: true
  push:
    tags: ['v*']
permissions: {}
concurrency:
  group: release-${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
  cancel-in-progress: false
jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
    steps:
      - id: tag
        shell: bash
        env:
          TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]] || {
            echo "tag must be v-prefixed semver" >&2
            exit 2
          }
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
  source-packages:
    needs: resolve
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.resolve.outputs.tag }}
          submodules: recursive
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
      - run: cargo package --locked --package tinydocs-bus
      - name: Archive the pinned TinyBus SDK
        run: |
          set -euo pipefail
          revision="$(git -C vendor/tinybus rev-parse --short=12 HEAD)"
          git -C vendor/tinybus archive --format=tar.gz --prefix="tinybus-$revision/" \
            --output="$PWD/target/package/tinybus-source-$revision.tar.gz" HEAD
      - uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808
        with:
          name: source-packages
          path: |
            target/package/tinydocs-bus-*.crate
            target/package/tinybus-source-*.tar.gz
          if-no-files-found: error
  module-release:
    needs: [resolve, source-packages]
    permissions:
      contents: write
    uses: tinyhumansai/.github/.github/workflows/module-release.yml@4adc1080fb495098e7af1aade82ed7e6e3c69bb7
    with:
      tag: ${{ needs.resolve.outputs.tag }}
      version: ${{ needs.resolve.outputs.version }}
      module-crate: tinydocs-module
      extra-packaged-files: '["docs/specs/tinybus-module.md"]'
      source-artifact: source-packages
