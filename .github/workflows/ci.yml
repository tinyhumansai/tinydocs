name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  module-ci:
    uses: tinyhumansai/.github/.github/workflows/module-ci.yml@9a61faece81fca0f8b10840851b7390bd61a6e94 # default test, metadata-derived MSRV, and recursive submodule checkout
    with:
      coverage-command: .github/scripts/check-file-coverage.sh 90 coverage.json
      module-e2e-command: scripts/test-e2e.sh
      feature-test-command: cargo test --locked --all-features
