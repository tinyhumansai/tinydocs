name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  module-ci:
    uses: tinyhumansai/.github/.github/workflows/module-ci.yml@40d135e9cf7ca23a31d79ef8e87ae3906d344428 # E2E/MSRV use root metadata; normalize manifest paths across OS
    with:
      coverage-command: .github/scripts/check-file-coverage.sh 90 coverage.json
      module-e2e-command: scripts/test-e2e.sh
      feature-test-command: cargo test --locked --all-features
