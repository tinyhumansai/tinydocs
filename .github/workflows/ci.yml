name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  module-ci:
    uses: tinyhumansai/.github/.github/workflows/module-ci.yml@325f72acd97b5901399759d906d73e4c199b5cd7 # E2E/MSRV use root metadata; normalize manifest paths across OS
    with:
      coverage-script: scripts/check-coverage.sh
      module-e2e-script: scripts/test-e2e.sh
      feature-test-script: scripts/test-features.sh
