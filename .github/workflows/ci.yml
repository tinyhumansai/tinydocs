name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  module-ci:
    uses: tinyhumansai/.github/.github/workflows/module-ci.yml@main
    with:
      coverage-command: .github/scripts/check-file-coverage.sh 90 coverage.json
      msrv: "1.88"
      module-e2e-command: scripts/test-e2e.sh
      feature-test-command: cargo test --locked --all-features
