name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  module-ci:
    uses: tinyhumansai/.github/.github/workflows/module-ci.yml@dccefcc2d14adcad107a66b3e7d3177a9e6b27fc # E2E and MSRV use the manifest toolchain; default test; recursive submodules
    with:
      coverage-command: .github/scripts/check-file-coverage.sh 90 coverage.json
      module-e2e-command: scripts/test-e2e.sh
      feature-test-command: cargo test --locked --all-features
