[package]
name = "tinydocs"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "GPL-3.0-only"
description = "Agent-friendly document synthesis and text extraction (DOCX, PPTX, PDF) in Rust."
repository = "https://github.com/tinyhumansai/tinydocs"
documentation = "https://docs.rs/tinydocs"
readme = "README.md"
keywords = ["docx", "ooxml", "pdf", "document", "agent"]
categories = ["text-processing"]
# Keep the published package to what a consumer actually needs.
exclude = [
    ".github/",
    ".gitmodules",
    "docs/",
    "vendor/",
    "worktrees/",
    ".env.example",
    "deny.toml",
]

[lib]
# Keep the ordinary Rust library while also allowing the `module` feature to
# produce the native artifact consumed by TinyBus's dynamic module loader.
crate-type = ["rlib", "cdylib"]

[dependencies]
# Derive macros for the crate-wide error type in `src/error/mod.rs`. Every
# dependency entry should carry a comment like this one saying why it is here.
thiserror = "2"
# The document spec types are the wire contract a host exposes to an LLM as a
# JSON tool schema, so they derive Serialize/Deserialize here rather than
# forcing every host to re-declare them.
serde = { version = "1", features = ["derive"] }
# OOXML `.docx` synthesis. Optional: exclusive to the `docx` feature so a host
# that only needs extraction does not pull the writer stack.
docx-rs = { version = "0.4.20", optional = true }
# TinyBus provides the typed service interface and the host/module ABI. These
# stay optional so ordinary document generation does not pull in a bus runtime.
tinybus = { version = "0.1.0", path = "vendor/tinybus/crates/tinybus", default-features = false, features = ["macros", "modules"], optional = true }
# The module-side SDK owns the runtime and exports the stable C ABI entrypoints.
tinybus-module = { version = "0.1.0", path = "vendor/tinybus/crates/tinybus-module", optional = true }
# Module methods move CPU-bound document synthesis onto Tokio's blocking pool.
tokio = { version = "1", features = ["macros", "rt-multi-thread"], optional = true }

[dev-dependencies]
# `.docx` output is a zip container; the tests re-open the produced bytes and
# assert on the OOXML parts inside.
zip = { version = "2", default-features = false, features = ["deflate"] }
# The spec types are a JSON wire contract; the tests assert they round-trip and
# that unknown keys are rejected.
serde_json = "1"

# The example generates a `.docx`, so it only builds when that gate is on.
# Without this, `--no-default-features` fails on the example rather than
# reporting the (correct) fact that the crate itself compiles fine.
[[example]]
name = "basic"
required-features = ["docx"]

[features]
default = ["docx"]
# `.docx` generation via `docx-rs`.
docx = ["dep:docx-rs"]
# Trusted in-process TinyBus module exposing document synthesis over the bus.
module = ["docx", "dep:tinybus", "dep:tinybus-module", "dep:tokio"]

# Lints apply to the whole crate and to every target. CI runs clippy with
# `-D warnings`, so anything set to "warn" here fails the build in CI.
[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Library code must not panic on its own; tests and examples may.
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
# Public fallible/panicking APIs must document their failure modes.
missing_errors_doc = "warn"
missing_panics_doc = "warn"
# Documentation hygiene.
doc_markdown = "warn"
# `#[must_use]` on pure public functions.
must_use_candidate = "warn"

[lints.rustdoc]
broken_intra_doc_links = "warn"
private_intra_doc_links = "warn"

[profile.release]
# Cross-crate optimization and smaller, faster binaries for release builds.
lto = "thin"
codegen-units = 1
strip = "debuginfo"
